name: Actualizar Reporte Económico

on:
  schedule:
    # Lunes a las 9 AM, zona horaria de Chile (UTC-4 en septiembre)
    - cron: '0 13 * * 1'
  workflow_dispatch:  # También permite ejecutar manualmente desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz
      
      - name: Ejecutar script de actualización
        run: python update_report.py
      
      - name: Commitear cambios
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add economia-chile-en-simple.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de indicadores - $(date)" && git push)
